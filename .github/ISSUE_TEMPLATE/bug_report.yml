name: Bug report
description: The kernel or the conformance suite does something the protocol says it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Cite the section of docs/PROTOCOL.md if it is a protocol rule.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The requests sent (no tokens), or a failing test. A failing test is best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker and Compose versions, the model (SAGE_MODEL), the device.
