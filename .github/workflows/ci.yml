# Lint, the dependency check, a secret scan, unit tests and the conformance suite: `make hygiene`, as locally.
# Everything runs in Docker on the runner, so no GPU and no model are needed (the suite uses a fake Ollama).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      # The source-tree checks (sealed containers, ignore files, no machine names) skip inside the image.
      - name: Source-tree checks
        run: python3 -m unittest -v tests.test_deploy tests.test_boundary
      - name: make hygiene
        run: make hygiene
