# Experiments (experiments/): the Rust sage-os kernel and the music-telling CLI. No models, no network in tests.
name: experiments

on:
  push:
    branches: [main]
    paths: ["experiments/**", ".github/workflows/experiments.yml"]
  pull_request:
    paths: ["experiments/**", ".github/workflows/experiments.yml"]

permissions:
  contents: read

jobs:
  sage-os:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/sage-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./check-make.sh
      - run: make imports
      - run: make lint
      - run: make test

  music-telling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/music-telling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make setup test lint imports
      - run: make image-test
