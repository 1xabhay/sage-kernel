# Reachy Mini device apps (devices/reachy-mini): the workspace's, the Sage voice app's and the simulator's
# tests and gates (`make lint imports vuln test`; `secrets` is the root CI's): no robot, no GPU, no models.
name: reachy

on:
  push:
    branches: [main] # main runs everything
  pull_request:
    paths:
      - devices/reachy-mini/**
      - sage/**
      - conformance/**
      - tests/voice_manifest.json
      - .github/workflows/reachy.yml

permissions:
  contents: read

jobs:
  sage-device:
    # The body-agnostic device package (devices/common/sage_device): stdlib only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices/common/sage_device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make lint imports vuln test

  sage-voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices/reachy-mini/apps/reachy_sage_voice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The reachy_mini SDK builds PyGObject/pycairo (same packages as Pollen's CI)
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libgirepository1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gir1.2-gst-plugins-base-1.0 gstreamer1.0-nice
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # A stuck test prints its stack, and a hung job ends instead of holding the check open.
      - run: uv run pytest -q -o faulthandler_timeout=120
        timeout-minutes: 15

  reachy-sim:
    runs-on: ubuntu-latest
    # The device tests run the root kernel's conformance suite.
    defaults:
      run:
        working-directory: devices/reachy-mini/apps/reachy_sim
    env:
      MUJOCO_GL: osmesa # offscreen eye-camera renders on a runner with no GPU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The reachy_mini SDK builds PyGObject/pycairo (same packages as Pollen's CI); libosmesa6 for the sim.
      - &apt
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libcairo2-dev libgirepository1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gir1.2-gst-plugins-base-1.0 gstreamer1.0-nice
      - &uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make lint imports vuln test

  workspace:
    runs-on: ubuntu-latest
    # The testbench and the tests in devices/reachy-mini/tests.
    defaults:
      run:
        working-directory: devices/reachy-mini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *apt
      - *uv
      - run: uv sync --locked
      - run: make lint imports vuln test

  integration:
    runs-on: ubuntu-latest
    # The voice against the root Sage kernel (conformance fake model).
    defaults:
      run:
        working-directory: devices/reachy-mini/apps/reachy_sage_voice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *apt
      - *uv
      - run: uv sync --locked
      - run: make integration
