[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-sage-voice"
version = "0.1.0"
description = "Real-time voice for Reachy Mini as a light client of the Sage kernel, on Pipecat"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
keywords = ["reachy-mini-app"]
dependencies = [
    "numpy>=2.2.5",
    # The robot SDK version the pet runs on.
    "reachy-mini==1.14.0",
    # The version an earlier voice bot measured its voice pipeline on. Silero's onset edge
    # drives barge-in.
    "pipecat-ai[silero]==1.15.0",
    "reachy-mini-dances-library==0.2.1",
    # Head-pose Euler angles (motion/runner.py) and replay resampling; reachy-mini 1.14
    # stopped bringing it in.
    "scipy>=1.18.1",
    # Settings from a .env, as Pollen's conversation app reads them.
    "python-dotenv>=1.2",
    "platformdirs>=4",
]

[project.entry-points."reachy_mini_apps"]
# The key is the project name exactly, as `reachy-mini-app-assistant check` wants.
reachy-sage-voice = "reachy_sage_voice.main:ReachySageVoice"

[project.scripts]
# Calibrate the turn-end silence on recordings of the owner talking to the robot.
sage-voice-turn-end = "reachy_sage_voice.turn_end:main"

[project.urls]
Source = "https://github.com/1xabhay/sage-kernel/tree/main/devices/reachy-mini/apps/reachy_sage_voice"
Space = "https://huggingface.co/spaces/sabhay22/reachy_sage_voice"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
# A project of its own, outside the root workspace, so Pipecat's pins
# (protobuf <7, soundfile ~=0.13) never move the live pet's packages.
# The robot's media stack exactly as the pet runs it: gstreamer-plugins 1.28.8,
# the newest, has no cp312 wheel.
constraint-dependencies = [
    "gstreamer-bundle==1.28.3",
    "gstreamer-cli==1.28.6",
    "gstreamer-ext-runtime==1.28.6",
    "gstreamer-gtk==1.28.6",
    "gstreamer-libs==1.28.6",
    "gstreamer-plugins==1.28.6",
    "gstreamer-plugins-gpl==1.28.6",
    "gstreamer-plugins-gpl-restricted==1.28.6",
    "gstreamer-plugins-libs==1.28.6",
    "gstreamer-plugins-restricted==1.28.6",
    "gstreamer-python==1.28.6",
]

# Body-agnostic device code (docs/design/LAYERS.md §2.5) ships inside the wheel, not as a
# dependency: pip ignores [tool.uv.sources], so a path dependency broke the Space's install.
# deploy/sources.py lists the folder, so the export and the release carry it.
[tool.setuptools.packages.find]
where = [".", "../../../common/sage_device"]
include = ["reachy_sage_voice*", "sage_device*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration suite needs a sage-kernel checkout: `make integration` runs it.
addopts = "-m 'not integration'"
markers = [
    "integration: the voice against the real Sage kernel (make integration)",
    "kernel_env: kernel settings for one integration test",
    "slew: keep the arbiter's real slew caps (conftest no_slew_limit)",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["reachy_sage_voice"]
known-local-folder = ["conftest"]
