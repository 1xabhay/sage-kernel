# Pollen's central relay (remote WebRTC through pollen-robotics-reachy-mini-central.hf.space)
# off: the daemon starts it whenever an HF token is stored, and has no switch, so its server
# address points at a closed local port instead. The HF login itself stays.
# /etc/systemd/system/reachy-mini-daemon.service.d/50-sage-no-relay.conf (make -C robot relay-off).
# ponytail: the relay keeps retrying 127.0.0.1:9 (backoff up to 60 s); a real switch needs upstream.
[Service]
Environment=REACHY_CENTRAL_URL=http://127.0.0.1:9
