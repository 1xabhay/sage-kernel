# Keep the robot's journal across reboots (Raspberry Pi OS ships Storage=volatile in
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf): a drop that ends in a
# reboot must leave its last seconds on record. Capped so the SD card never fills.
# Installed as /etc/systemd/journald.conf.d/50-sage-persistent.conf (make -C robot install).
[Journal]
Storage=persistent
SystemMaxUse=200M
