[package]
name = "sage-wasm"
version = "0.1.0"
edition = "2024"
description = "sage-core for a browser tab: JSON in, JSON out, through WebAssembly memory."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sage-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
